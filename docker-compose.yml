services:
    por-devcontainer:
        image: por-devcontainer
        container_name: por-devcontainer
        build:
            context: .
            dockerfile: Dockerfile
            target: devcontainer
        volumes:
            - .:/workspace:cached
            - ./resources:/resources
            - /run/udev:/run/udev:ro
        env_file:
            - .env
        privileged: true
        entrypoint: ["tail", "-f", "/dev/null"]
        networks:
            - por

    por-core:
        image: por-core
        container_name: por-core
        build:
            context: .
            dockerfile: Dockerfile
            target: core
        volumes:
            - $PWD/resources:/resources
        env_file:
            - .env
        privileged: true
        networks:
            - por

    por-redis:
        image: redis:8.10.1
        container_name: por-redis
        volumes:
            - $PWD/resources/cache/redis:/data
        restart: unless-stopped
        networks:
            - por

    por-qdrant:
        image: qdrant/qdrant:v1.19.0
        container_name: por-qdrant
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - ./resources/db/qdrant:/qdrant/storage
        restart: unless-stopped
        networks:
            - por

    por-app:
        image: por-app
        container_name: por-app
        depends_on:
            - por-qdrant
            - por-redis
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        volumes:
            - $PWD/resources:/resources
            - /run/udev:/run/udev:ro
        env_file:
            - .env
        environment:
            FORCE_COLOR: "1"
            TERM: xterm-256color
        privileged: true
        restart: unless-stopped
        networks:
            - por

networks:
    por:
        name: por
        driver: bridge
